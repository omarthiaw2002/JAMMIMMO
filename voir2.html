<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Détails du produit</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .product-container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
        }
        
        .product-images {
            flex: 1;
            min-width: 300px;
        }
        
        .main-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        
        .thumbnail-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        
        .thumbnail {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.3s;
        }
        
        .thumbnail:hover {
            transform: scale(1.05);
        }
        
        .product-details {
            flex: 1;
            min-width: 300px;
        }
        
        .price {
            font-size: 24px;
            font-weight: bold;
            color: #e63946;
            margin: 15px 0;
        }
        
        .description {
            margin-bottom: 20px;
        }
        
        .features {
            margin-bottom: 20px;
        }
        
        .feature-item {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }
        
        .feature-item i {
            margin-right: 10px;
            color: #3110f0;
        }
        
        .btn {
            display: inline-block;
            background-color: #1c22d7;
            color: white;
            padding: 12px 24px;
            text-align: center;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        
        .btn:hover {
            background-color: #45a049;
        }
        
        @media (max-width: 768px) {
            .product-container {
                flex-direction: column;
            }
            
            .thumbnail-container {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <a href="index.html" class="btn">Accueil</a>
        <h1>bel appartement à Ngor Almadie</h1>
    </div>
    
    <div class="product-container">
        <div class="product-images">
            <img id="mainImage" src="image/WhatsApp Image 2025-08-24 à 15.36.23_8d83f9e6.jpg" alt="Produit principal" class="main-image">
            
            <div class="thumbnail-container">
                <img src="image/WhatsApp Image 2025-08-24 à 15.36.18_e4810b56.jpg" alt="Vue 1" class="thumbnail" onclick="changeImage(this)">
                <img src="image/WhatsApp Image 2025-08-24 à 15.36.19_736d70dc.jpg" alt="Vue 2" class="thumbnail" onclick="changeImage(this)">
                <img src="image/WhatsApp Image 2025-08-24 à 15.36.22_cf9772a3.jpg" alt="Vue 3" class="thumbnail" onclick="changeImage(this)">
                <img src="image/WhatsApp Image 2025-08-24 à 15.36.24_267aac6a.jpg" alt="Vue 4" class="thumbnail" onclick="changeImage(this)">
            </div>
        </div>
        
        <div class="product-details">
            <h2>Description</h2>
            <p class="description">
                Studio meublé sur Ngor non loin de l’ancienne gendarmerie de Ngor. 

            </p>
            
            <div class="price">30.000cfa la nuitée</div>
            
            <div class="features">
                <h3>Caractéristiques</h3>
                <div class="feature-item">
                    <i>✓</i> <span>1 séjour avec espace cuisine et balcon 
</span>
                </div>
                <div class="feature-item">
                    <i>✓</i> <span>1 toilette visiteurs 
</span>
                </div>
                <div class="feature-item">
                    <i>✓</i> <span>1 chambres avec salle de bain
</span>
                </div>
               
            </div>
        </div>
    </div>
    
    <script>
        function changeImage(element) {
            document.getElementById('mainImage').src = element.src.replace('150x100', '600x400');
        }
    </script>
</body>
</html>
